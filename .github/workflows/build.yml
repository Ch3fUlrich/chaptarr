name: Build Chaptarr

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, 'lane/**', 'smartci-*' ]
    # `labeled` re-runs CI when merge-ready is added: that run is the FULL suite.
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full suite (a dispatch is always a full run)
        type: boolean
        default: true

# Tests only, never publishes. PRs and merges are both validated automatically, but
# nothing reaches users until release.yml is run by hand; docker-publish.yml is
# workflow_call-only, so no run started here can push an image.

# One live run per PR and per branch: a newer push supersedes the older run, so a
# batch of merges costs one build of the combined result rather than one each.
# Release-called runs are never cancelled - that would silently drop the gate.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

# measurement base only: this repo's develop fails restore on new NuGet advisories
env:
  NuGetAudit: 'false'

jobs:
  # CI-SMART-SELECT (D-1475): a PR push runs only what its diff needs (map:
  # .github/smart-ci.json). The FULL suite runs on the merge-ready label,
  # workflow_dispatch, every push, every release call, and whenever the selection is
  # unknown or a workflow / dependency / CI file changed. Pinned to a branch of the
  # shared workflow until it merges; re-pin to a SHA afterwards.
  smart:
    name: Smart CI select
    uses: Ch3fUlrich/AutoOS/.github/workflows/smart-ci.yml@lane/ci-smart-select
    with:
      selector_repo: Ch3fUlrich/AutoOS
      selector_ref: lane/ci-smart-select
      runs_on: ${{ toJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNS_ON && fromJSON(vars.CI_LINUX_RUNS_ON) || 'ubuntu-latest') }}
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}

  # Cheap repo guards (formerly the first steps of every build leg): once, always.
  guards:
    name: Repo guards
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).guards }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNS_ON && fromJSON(vars.CI_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0

    - name: Guard (repo) - no merge-conflict markers
      shell: bash
      run: |
        if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
          echo "Merge-conflict markers found in tracked files."
          exit 1
        fi
        python3 -c "import json; json.load(open('package.json', encoding='utf-8'))"

    - name: Guard (version) - package.json and Directory.Build.props in sync
      shell: bash
      run: python3 build-tools/version_guard.py sync

    - name: Guard (version) - no decreases on develop
      if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/develop:refs/remotes/origin/develop"
          COMPARE_REF="origin/develop"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            echo "No reachable version tag is available for monotonic version comparison."
            exit 1
          fi
        fi

        python3 build-tools/version_guard.py monotonic \
          --compare-ref "$COMPARE_REF" \
          --event-path "$GITHUB_EVENT_PATH"

    - name: Guard (version) - version-only commits stay pure
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          git fetch --no-tags origin "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          COMPARE_REF="origin/${{ github.base_ref }}"
        else
          COMPARE_REF="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"

          if [[ -z "$COMPARE_REF" ]]; then
            echo "No reachable version tag is available for version-only commit hygiene."
            exit 1
          fi
        fi

        python3 build-tools/version_guard.py commit-hygiene --compare-ref "$COMPARE_REF"

  build:
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).dotnet }}
    # Self-hosted Linux slot when the repo variable CI_LINUX_RUNS_ON says so (JSON
    # runs-on); otherwise the hosted image, as before. A selected PR run builds the
    # Linux leg only; the full run adds Windows and macOS unless CI_ONLY_LINUX=true
    # (a repo with no hosted runners available).
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNS_ON && fromJSON(vars.CI_LINUX_RUNS_ON) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.smart.outputs.full == 'true' && vars.CI_ONLY_LINUX != 'true' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/NuGet.config', 'src/Directory.Packages.props', 'src/Directory.Build.props', 'src/Directory.Build.targets', 'src/Targets/**/*.targets', 'src/Chaptarr.NoTests.sln', 'src/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-nuget-
    
    # FFmpeg is intentionally not downloaded in this compile/test workflow.
    # Source builds resolve bundled tools first and then the system PATH; explicit
    # native packaging owns bundled-tool acquisition and validation.

    - name: Restore dependencies
      run: |
        dotnet restore src/Chaptarr.NoTests.sln
        dotnet restore src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj
    
    - name: Build
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore
    
    - name: Test
      shell: bash
      env:
        FULL: ${{ needs.smart.outputs.full }}
        SELECTED: ${{ needs.smart.outputs.tests }}   # Chaptarr.Core.Test sub-namespaces; empty = everything
      run: |
        filter=()
        if [ "$FULL" != "true" ] && [ -n "$SELECTED" ]; then
          expr=""
          for t in $SELECTED; do expr="${expr:+$expr|}FullyQualifiedName~Chaptarr.Core.Test.$t."; done
          filter=(--filter "$expr")
        fi
        dotnet test src/Chaptarr.Core.Test/Chaptarr.Core.Test.csproj --configuration Release --no-restore --verbosity normal "${filter[@]}"
    
    - name: Publish
      if: ${{ needs.smart.outputs.full == 'true' }}
      run: |
        dotnet publish src/NzbDrone.Console/Chaptarr.Console.csproj -c Release -f net10.0 -o ./publish/Chaptarr
        dotnet publish src/NzbDrone.Update/Chaptarr.Update.csproj -c Release -f net10.0 -o ./publish/Chaptarr/Chaptarr.Update
    
    - name: Upload artifacts
      if: ${{ needs.smart.outputs.full == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: chaptarr-${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'windows-latest' && 'win' || 'osx' }}
        path: ./publish/
        retention-days: 7
        if-no-files-found: error

  postgres-migrations:
    needs: smart
    if: ${{ vars.CI_SKIP_POSTGRES != 'true' && (needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).postgres) }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNS_ON && fromJSON(vars.CI_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaptarr
          POSTGRES_PASSWORD: chaptarr
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U chaptarr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.x

    - name: Install PostgreSQL client
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create databases
      shell: bash
      env:
        PGPASSWORD: chaptarr
        PGPORT: ${{ job.services.postgres.ports['5432'] }}
      run: |
        set -euo pipefail
        psql -h localhost -p "$PGPORT" -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-main";'
        psql -h localhost -p "$PGPORT" -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-log";'
        psql -h localhost -p "$PGPORT" -U chaptarr -d postgres -c 'CREATE DATABASE "chaptarr-cache";'

    - name: Restore dependencies
      run: dotnet restore src/Chaptarr.NoTests.sln

    - name: Build (migrations smoke)
      run: dotnet build src/Chaptarr.NoTests.sln --configuration Release --no-restore

    - name: Smoke - migrate up on fresh PostgreSQL
      shell: bash
      env:
        Chaptarr__Postgres__Host: localhost
        Chaptarr__Postgres__Port: ${{ job.services.postgres.ports['5432'] }}
        Chaptarr__Postgres__User: chaptarr
        Chaptarr__Postgres__Password: chaptarr
        Chaptarr__Postgres__MainDb: chaptarr-main
        Chaptarr__Postgres__LogDb: chaptarr-log
        Chaptarr__Postgres__CacheDb: chaptarr-cache
        Chaptarr__Server__BindAddress: 127.0.0.1
        Chaptarr__Server__Port: 8789
      run: |
        set -euo pipefail

        DATA_DIR="$(mktemp -d)"
        echo "Using data dir: $DATA_DIR"

        dotnet run --project src/NzbDrone.Console/Chaptarr.Console.csproj -c Release --no-build --framework net10.0 -- \
          /nobrowser "/data=$DATA_DIR" > app.log 2>&1 &
        pid=$!

        ready=""
        for i in $(seq 1 90); do
          if curl -fsS "http://127.0.0.1:8789/ping" >/dev/null 2>&1; then
            ready="yes"
            break
          fi
          sleep 1
        done

        kill "$pid" >/dev/null 2>&1 || true
        wait "$pid" >/dev/null 2>&1 || true

        if [ "$ready" != "yes" ]; then
          echo "Chaptarr failed to start or /ping did not become ready."
          tail -n 400 app.log || true
          exit 1
        fi

        echo "PostgreSQL migrations smoke test passed."

  merge-gate:
    name: CI merge gate
    if: always()
    needs: [smart, guards, build, postgres-migrations]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_LINUX_RUNS_ON && fromJSON(vars.CI_LINUX_RUNS_ON) || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Selected jobs passed; report whether the run was full
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.smart.outputs.full }}
          REASON: ${{ needs.smart.outputs.reason }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "event=$EVENT full=$FULL results=$RESULTS reason=$REASON"
          ctx="Full suite (merge-ready)"
          post() {
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPO/statuses/$SHA"               -d "$(python3 -c 'import json,sys; print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3]}))' "$1" "$ctx" "$2")" >/dev/null               || echo "::warning::could not set the $ctx status"
          }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) post failure "a CI job ended $r"; echo "::error::a CI job ended $r"; exit 1 ;;
            esac
          done
          if [ "$EVENT" = pull_request ] && [ "$FULL" != true ]; then
            post pending "selected-only run: add the merge-ready label for the full suite"
            echo "::notice::selected-only run passed; the full suite (label merge-ready or dispatch full=true) is still required before merge"
          else
            post success "full suite passed"
          fi
